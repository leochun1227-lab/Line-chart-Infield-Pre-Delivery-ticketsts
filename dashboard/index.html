<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claims Received Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="dashboard-shell">
    <section class="chart-card" aria-labelledby="chart-title">
      <div class="chart-header">
        <div>
          <p class="eyebrow">Warranty Claims</p>
          <h1 id="chart-title">Claims received infield / pre-delivery</h1>
          <p class="subtitle">Monthly counts by ticket CreatedOn. Reads all matching Firebase tickets and lets you select one year at a time.</p>
        </div>
        <div class="actions">
          <label class="year-filter" for="yearSelect">Year
            <select id="yearSelect" aria-label="Select report year"></select>
          </label>
          <button id="refreshButton" type="button">Refresh</button>
          <span id="lastUpdated" class="last-updated">Loading…</span>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="claimsChart" aria-label="Line chart of in field and pre delivery warranty claims by month"></canvas>
      </div>
      <p id="statusMessage" class="status" role="status"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
