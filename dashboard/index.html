<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claims Received Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="dashboard-shell">
    <section class="chart-card" aria-labelledby="chart-title">
      <div class="chart-header">
        <div class="title-block">
          <p class="eyebrow">Warranty Claims</p>
          <h1 id="chart-title">In Field &amp; Pre Delivery Warranty Tickets Created by Month</h1>
        </div>
        <div class="last-updated" id="lastUpdated">Loading…</div>
      </div>
      <div class="dashboard-body">
        <div class="chart-wrap">
          <canvas id="claimsChart" aria-label="Line chart of in field and pre delivery warranty claims by month"></canvas>
        </div>
        <aside class="side-controls" aria-label="Dashboard filters">
          <label class="control-field year-control" for="yearSelect">Year
            <select id="yearSelect" aria-label="Select report year"></select>
          </label>
          <div class="filter-menu-wrap">
            <button id="filterButton" class="secondary-button" type="button" aria-expanded="false" aria-controls="filterPanel">Filter</button>
            <div id="filterPanel" class="filter-panel" hidden>
              <div id="customRange" class="custom-range">
                <label class="control-field" for="startMonth">From
                  <input id="startMonth" type="month" aria-label="Start month" />
                </label>
                <label class="control-field" for="endMonth">To
                  <input id="endMonth" type="month" aria-label="End month" />
                </label>
              </div>
              <div class="filter-actions">
                <button id="applyFilterButton" type="button">Apply range</button>
                <button id="last12Button" class="secondary-button" type="button">Last 12 months</button>
                <button id="clearFilterButton" class="ghost-button" type="button">Clear range</button>
              </div>
            </div>
          </div>
          <button id="refreshButton" type="button">Refresh</button>
        </aside>
      </div>
      <p id="statusMessage" class="status" role="status"></p>
    </section>
  </main>

  <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite" hidden>
    <div class="loading-card">
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading dashboard data…</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
